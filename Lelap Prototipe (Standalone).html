document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

or }};\">Tunas<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fx-import>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 480, &quot;height&quot;: 940},\n  &quot;previewTreeStage&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;Otomatis&quot;, &quot;options&quot;: [&quot;Otomatis&quot;, &quot;Tunas&quot;, &quot;Akar&quot;, &quot;Rimbun&quot;, &quot;Pucuk&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;dataSaverMode&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Demo&quot;},\n  &quot;startTab&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;beranda&quot;, &quot;options&quot;: [&quot;beranda&quot;, &quot;pesan&quot;, &quot;lala&quot;, &quot;tunas&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Demo&quot;}\n}\">\nconst TIER_RANGES = { TUNAS: [0, 200], AKAR: [200, 550], RIMBUN: [550, 900], PUCUK: [900, 900] };\nconst TIER_NEXT = { TUNAS: 'AKAR', AKAR: 'RIMBUN', RIMBUN: 'PUCUK', PUCUK: null };\nconst TIER_COLOR = { TUNAS: '#8FA876', AKAR: '#5C8A63', RIMBUN: '#2F5D46', PUCUK: '#1E3D2C' };\n\nfunction tierOf(lifetime) {\n  if (lifetime >= 900) return 'PUCUK';\n  if (lifetime >= 550) return 'RIMBUN';\n  if (lifetime >= 200) return 'AKAR';\n  return 'TUNAS';\n}\n\nconst UNITS = {\n  LelapPod: [\n    { id: 'pod1', name: 'LelapPod Stasiun Gambir', city: 'Jakarta' },\n    { id: 'pod2', name: 'LelapPod Bandara Soetta T3', city: 'Tangerang' },\n    { id: 'pod3', name: 'LelapPod Kota Tua', city: 'Jakarta' },\n  ],\n  LelapCabin: [\n    { id: 'cab1', name: 'LelapCabin Riverside', city: 'Ubud' },\n    { id: 'cab2', name: 'LelapCabin Puncak Valley', city: 'Bogor' },\n    { id: 'cab3', name: 'LelapCabin Lembang Hills', city: 'Bandung' },\n  ],\n  LelapNest: [\n    { id: 'nest1', name: 'LelapNest Kemang', city: 'Jakarta' },\n    { id: 'nest2', name: 'LelapNest Dago', city: 'Bandung' },\n    { id: 'nest3', name: 'LelapNest Sudirman', city: 'Jakarta' },\n  ],\n};\n\nconst PRICES = {\n  LelapPod: { tunas: 150000, rimbun: 210000 },\n  LelapCabin: { tunas: 320000, rimbun: 450000 },\n  LelapNest: { tunas: 3500000, rimbun: 3500000 },\n};\n\nconst SAMPAH = [\n  { label: 'Kulit Buah', correct: 'organik' },\n  { label: 'Botol Plastik', correct: 'anorganik' },\n  { label: 'Baterai Bekas', correct: 'b3' },\n  { label: 'Kardus Bekas', correct: 'anorganik' },\n];\n\nconst KUIS = [\n  { text: 'Air abu-abu (grey water) di LelapPod diproses buat apa?', options: ['Dibuang langsung ke selokan', 'Dimurnikan & dipakai ulang', 'Dikirim ke pabrik'], correct: 1 },\n  { text: 'Baterai bekas termasuk kategori sampah apa?', options: ['Organik', 'Anorganik biasa', 'B3 / Berbahaya'], correct: 2 },\n  { text: 'TONG TUNAS ngasih Tunas otomatis lewat apa?', options: ['Difoto manual & dikirim ke CS', 'QR + sensor berat saat setor sampah', 'Nebak berat sampah sendiri'], correct: 1 },\n];\n\nclass Component extends DCLogic {\n  state = {\n    activeTab: this.props.startTab || 'beranda',\n    tunasLifetime: 340,\n    tunasBalance: 265,\n    toast: null,\n    booking: {\n      step: 0, produk: null, checkin: '2026-07-12', checkout: '2026-07-14',\n      unitId: null, unitName: '', paket: null, sudutTumbuh: false, imbangKarbon: false,\n      confirmed: false, code: '',\n    },\n    lalaMessages: [\n      { from: 'lala', text: 'Halo! Aku Lala 🌿 Aku bisa bantu soal Paket Lestari, Jejak Rehat, atau kegiatan hijau kamu. Mau mulai dari mana?' },\n    ],\n    lalaDraft: '',\n    hubMode: 'default',\n    sampahIndex: 0, sampahScore: 0,\n    kuisIndex: 0, kuisScore: 0,\n    vouchers: [\n      { id: 'v1', title: 'Diskon 20% Kopi Ruang Ide', partner: 'Rekan Lelap · UMKM Kopi', cost: 100, redeemed: false },\n      { id: 'v2', title: 'Sewa Sepeda 2 Jam', partner: 'Komunitas Bumi Bersih', cost: 150, redeemed: false },\n      { id: 'v3', title: 'Tumbler LELAP Daur Ulang', partner: 'CIPTA Merch', cost: 200, redeemed: false },\n      { id: 'v4', title: 'Voucher Rp50rb Paket Rimbun', partner: 'LELAP', cost: 300, redeemed: false },\n    ],\n    ledger: [\n      { label: 'Menginap LelapCabin Riverside', delta: 40, whenStr: '5 hari lalu' },\n      { label: 'LelapKuis: ESG Dasar', delta: 30, whenStr: '6 hari lalu' },\n      { label: 'Tukar: Sewa Sepeda 2 Jam', delta: -150, whenStr: '9 hari lalu' },\n      { label: 'TONG TUNAS: setor 1.2kg plastik', delta: 25, whenStr: '12 hari lalu' },\n    ],\n  };\n\n  fmtRp(n) { return 'Rp' + Math.round(n).toLocaleString('id-ID'); }\n\n  fmtDateRange(inStr, outStr) {\n    const opts = { day: 'numeric', month: 'short' };\n    const inD = new Date(inStr);\n    const outD = new Date(outStr);\n    const f = (d) => isNaN(d.getTime()) ? '-' : d.toLocaleDateString('id-ID', opts);\n    return f(inD) + ' – ' + f(outD);\n  }\n\n  nights() {\n    const b = this.state.booking;\n    const inD = new Date(b.checkin);\n    const outD = new Date(b.checkout);\n    const diff = Math.round((outD - inD) / 86400000);\n    return diff > 0 ? diff : 1;\n  }\n\n  priceFor(produk, paket) {\n    return PRICES[produk] ? PRICES[produk][paket] : 0;\n  }\n\n  computeTotal() {\n    const b = this.state.booking;\n    if (!b.produk || !b.paket) return 0;\n    let base;\n    if (b.produk === 'LelapNest') { base = 3500000; }\n    else { base = this.nights() * this.priceFor(b.produk, b.paket); }\n    let addons = 0;\n    if (b.sudutTumbuh) addons += 25000;\n    if (b.imbangKarbon) addons += 15000;\n    return base + addons;\n  }\n\n  selStyle(active) {\n    return {\n      border: active ? '#2F5D46' : '#E6D9C2',\n      bg: active ? '#F4F8F5' : '#FFFFFF',\n      radio: active ? '#2F5D46' : '#D9CBAF',\n    };\n  }\n\n  tierInfo() {\n    const lifetime = this.state.tunasLifetime;\n    const real = tierOf(lifetime);\n    const forcedRaw = this.props.previewTreeStage;\n    const forced = (forcedRaw && forcedRaw !== 'Otomatis') ? forcedRaw.toUpperCase() : null;\n    const tier = forced || real;\n    const color = TIER_COLOR[tier];\n    let pct, caption;\n    if (forced) {\n      pct = 65;\n      caption = 'Mode pratinjau — tahap ' + tier;\n    } else {\n      const range = TIER_RANGES[tier];\n      if (TIER_NEXT[tier] === null) {\n        pct = 100;\n        caption = 'Tahap tertinggi tercapai 🌳';\n      } else {\n        pct = Math.round(((lifetime - range[0]) / (range[1] - range[0])) * 100);\n        const needed = range[1] - lifetime;\n        caption = needed + ' Tunas lagi ke tahap ' + TIER_NEXT[tier];\n      }\n    }\n    const nextTreeAt = (Math.floor(lifetime / 500) + 1) * 500;\n    return {\n      tier, color, pct, caption,\n      toNextTree: nextTreeAt - lifetime,\n      isTunas: tier === 'TUNAS', isAkar: tier === 'AKAR', isRimbun: tier === 'RIMBUN', isPucuk: tier === 'PUCUK',\n    };\n  }\n\n  selectProduk(p) { this.setState(s => ({ booking: { ...s.booking, produk: p, unitId: null, unitName: '' } })); }\n  selectUnitTo(id, name) { this.setState(s => ({ booking: { ...s.booking, unitId: id, unitName: name } })); }\n  selectPaket(p) { this.setState(s => ({ booking: { ...s.booking, paket: p } })); }\n  toggleSudutTumbuh() { this.setState(s => ({ booking: { ...s.booking, sudutTumbuh: !s.booking.sudutTumbuh } })); }\n  toggleImbangKarbon() { this.setState(s => ({ booking: { ...s.booking, imbangKarbon: !s.booking.imbangKarbon } })); }\n  onCheckinChange(e) { const v = e.target.value; this.setState(s => ({ booking: { ...s.booking, checkin: v } })); }\n  onCheckoutChange(e) { const v = e.target.value; this.setState(s => ({ booking: { ...s.booking, checkout: v } })); }\n  prevStep() { this.setState(s => ({ booking: { ...s.booking, step: Math.max(0, s.booking.step - 1) } })); }\n  nextStep() {\n    this.setState(s => {\n      if (s.booking.step >= 4) {\n        const code = 'LLP-' + Math.floor(10000 + Math.random() * 89999);\n        return { booking: { ...s.booking, confirmed: true, code } };\n      }\n      return { booking: { ...s.booking, step: s.booking.step + 1 } };\n    });\n  }\n  resetBooking() {\n    this.setState({ booking: { step: 0, produk: null, checkin: '2026-07-12', checkout: '2026-07-14', unitId: null, unitName: '', paket: null, sudutTumbuh: false, imbangKarbon: false, confirmed: false, code: '' } });\n  }\n  goBeranda() { this.setState({ activeTab: 'beranda' }); }\n\n  addLalaMessage(from, text) { this.setState(s => ({ lalaMessages: [...s.lalaMessages, { from, text }] })); }\n  sendQuickRecommend() {\n    this.addLalaMessage('user', 'Rekomendasiin Paket Lestari');\n    setTimeout(() => this.addLalaMessage('lala', 'Kalau kamu mau fasilitas eco paling lengkap, aku saranin Paket Rimbun di LelapCabin. Kalau budget lebih penting tapi tetap mau berdampak, Paket Tunas juga udah include daur ulang air & energi kok 🌿'), 450);\n  }\n  sendQuickJejak() {\n    this.addLalaMessage('user', 'Jejak Rehat aku gimana?');\n    setTimeout(() => this.addLalaMessage('lala', 'Dari nginep terakhir kamu di LelapCabin Riverside, kamu udah bantu hemat 128L air, 4.2 kWh energi, dan kurangin ~6.5kg CO₂ dibanding hotel biasa. Mantap! 🌱'), 450);\n  }\n  sendQuickTunas() {\n    this.addLalaMessage('user', 'Gimana cara dapet Tunas?');\n    setTimeout(() => this.addLalaMessage('lala', 'Banyak jalan: main Games & LelapKuis di Tunas Hub, setor sampah ke TONG TUNAS pas nginep, ikutan Sudut Tumbuh di LelapCabin, atau tukar jadi voucher. Coba buka Tunas Hub yuk!'), 450);\n  }\n  sendQuickBengkel() {\n    this.addLalaMessage('user', 'Ada Bengkel Tunas terdekat?');\n    setTimeout(() => this.addLalaMessage('lala', 'Bengkel Tunas rutin diadain di titik LelapPod & LelapCabin bareng komunitas lokal kayak Komunitas Bumi Bersih. Jadwal lengkapnya nanti nyusul di sini ya 🙏'), 450);\n  }\n  onDraftChange(e) { this.setState({ lalaDraft: e.target.value }); }\n  onDraftKeyDown(e) { if (e.key = ate.kuisScore * 15, 'LelapKuis: ESG'); }\n  redeemVoucher(id) {\n    const v = this.state.vouchers.find(x => x.id === id);\n    if (!v || v.redeemed || v.cost > this.state.tunasBalance) return;\n    this.setState(s => ({\n      vouchers: s.vouchers.map(x => x.id === id ? { ...x, redeemed: true } : x),\n      tunasBalance: s.tunasBalance - v.cost,\n      ledger: [{ label: 'Tukar: ' + v.title, delta: -v.cost, whenStr: 'Baru saja' }, ...s.ledger],\n    }));\n    this.showToast('Berhasil ditukar! 🎉');\n  }\n\n  renderVals() {\n    const s = this.state;\n    const b = s.booking;\n    const tier = this.tierInfo();\n    const tabColor = (t) => s.activeTab === t ? '#2F5D46' : '#B8A98C';\n\n    const podStyle = this.selStyle(b.produk === 'LelapPod');\n    const cabinStyle = this.selStyle(b.produk === 'LelapCabin');\n    const nestStyle = this.selStyle(b.produk === 'LelapNest');\n    const rimbunStyle = this.selStyle(b.paket === 'rimbun');\n    const tunasPaketStyle = this.selStyle(b.paket === 'tunas');\n\n    const unitOptions = (b.produk ? UNITS[b.produk] : []).map(u => ({\n      id: u.id, name: u.name, city: u.city,\n      selected: b.unitId === u.id,\n      border: b.unitId === u.id ? '#2F5D46' : '#E6D9C2',\n      bg: b.unitId === u.id ? '#F4F8F5' : '#FFFFFF',\n      radioColor: b.unitId === u.id ? '#2F5D46' : '#D9CBAF',\n      select: () => this.selectUnitTo(u.id, u.name),\n    }));\n\n    const total = this.computeTotal();\n    const nightsCount = this.nights();\n    const stepValid = [!!b.produk, !!b.unitId, !!b.paket, true, true];\n    const nextDisabled = !stepValid[b.step];\n    const addonParts = [];\n    if (b.sudutTumbuh) addonParts.push('Sudut Tumbuh');\n    if (b.imbangKarbon) addonParts.push('Imbang Karbon');\n    const addonsLabel = addonParts.length ? addonParts.join(' + ') : 'Tidak ada';\n    const dateRangeLabel = this.fmtDateRange(b.checkin, b.checkout) + ' · ' + nightsCount + ' malam';\n    const priceLabelFor = (paket) => {\n      if (!b.produk) return olor('pesan'),\n      tabLalaColor: tabColor('lala'), tabTunasColor: tabColor('tunas'),\n      tabTunasFill: s.activeTab === 'tunas' ? '#2F5D46' : 'none',\n\n      hasToast: !!s.toast, toastMsg: s.toast || '',\n\n      tierLabel: tier.tier, tierColor: tier.color,\n      tierChipBg: tier.color + '22', tierChipColor: tier.color,\n      tierProgressPct: tier.pct, tierProgressCaption: tier.caption,\n      tunasLifetime: s.tunasLifetime, tunasBalance: s.tunasBalance,\n      tunasToNextTree: tier.toNextTree,\n      isTierTunas: tier.isTunas, isTierAkar: tier.isAkar, isTierRimbun: tier.isRimbun, isTierPucuk: tier.isPucuk,\n      showFullTree: !this.props.dataSaverMode, showCompactTree: !!this.props.dataSaverMode,\n\n      isConfirmed: b.confirmed, isBookingSteps: !b.confirmed,\n      isStep0: !b.confirmed && b.step === 0, isStep1: !b.confirmed && b.step === 1,\n      isStep2: !b.confirmed && b.step === 2, isStep3: !b.confirmed && b.step === 3,\n      isStep4: !b.confirmed && b.step === 4,\n      stepLabel: 'Langkah ' + (b.step + 1) + ' dari 5',\n      stepProgressPct: Math.round(((b.step + 1) / 5) * 100),\n      podStyle, cabinStyle, nestStyle,\n      isProdukPod: b.produk === 'LelapPod', isProdukCabin: b.produk === 'LelapCabin', isProdukNest: b.produk === 'LelapNest',\n      selectPod: () => this.selectProduk('LelapPod'),\n      selectCabin: () => this.selectProduk('LelapCabin'),\n      selectNest: () => this.selectProduk('LelapNest'),\n      checkinValue: b.checkin, checkoutValue: b.checkout,\n      onCheckinChange: (e) => this.onCheckinChange(e),\n      onCheckoutChange: (e) => this.onCheckoutChange(e),\n      produkLabel: b.produk || '',\n      unitOptions,\n      rimbunStyle, tunasPaketStyle,\n      rimbunPriceLabel: priceLabelFor('rimbun'), tunasPaketPriceLabel: priceLabelFor('tunas'),\n      selectPaketRimbun: () => this.selectPaket('rimbun'),\n      selectPaketTunas: () => this.selectPaket('tunas'),\n      showSudutTumbuh: b.produk === 'LelapCabin',\n      onToggleSudutTumbuh: () => this.toggleSudutTumbuh(),\n      onToggleImbangKarbon: () => this.toggleImbangKarbon(),\n      sudutTumbuhTrackBg: b.sudutTumbuh ? '#2F5D46' : '#E6D9C2',\n      sudutTumbuhKnobLeft: b.sudutTumbuh ? 22 : 3,\n      imbangKarbonTrackBg: b.imbangKarbon ? '#2F5D46' : '#E6D9C2',\n      imbangKarbonKnobLeft: b.imbangKarbon ? 22 : 3,\n      summaryProdukUnit: (b.produk || '-') + (b.unitName ? (' · ' + b.unitName) : ''),\n      summaryDates: dateRangeLabel,\n      summaryPaket: summaryPaketLabel,\n      summaryAddons: addonsLabel,\n      summaryTotalLabel: this.fmtRp(total),\n      showEstimate: !b.confirmed && b.step >= 2,\n      estimateTotalLabel: this.fmtRp(total),\n      showBack: !b.confirmed && b.step > 0,\n      onPrevStep: () => this.prevStep(),\n      onNextStep: () => this.nextStep(),\n      nextDisabled,\n      nextButtonBg: nextDisabled ? '#D9CBAF' : '#2F5D46',\n      nextButtonLabel: b.step < 4 ? 'Lanjut' : ('Bayar ' + this.fmtRp(total)),\n      confirmProdukUnit: (b.produk || '-') + (b.unitName ? (' · ' + b.unitName) : ''),\n      confirmDates: dateRangeLabel,\n      confirmPaketLabel: summaryPaketLabel,\n      confirmTotalLabel: this.fmtRp(total),\n      confirmCode: b.code,\n      onGoBeranda: () => this.goBeranda(),\n      onResetBooking: () => this.resetBooking(),\n\n      lalaMessages,\n      sendQuickRecommend: () => this.sendQuickRecommend(),\n      sendQuickJejak: () => this.sendQuickJejak(),\n      sendQuickTunas: () => this.sendQuickTunas(),\n      sendQuickBengkel: () => this.sendQuickBengkel(),\n      draftValue: s.lalaDraft,\n      onDraftChange: (e) => this.onDraftChange(e),\n      onDraftKeyDown: (e) => this.onDraftKeyDown(e),\n      sendDraft: () => this.sendDraft(),\n\n      hubDefault: s.hubMode === 'default', hubSampah: s.hubMode === 'sampah',\n      hubSampahResult: s.hubMode === 'sampah-done', hubKuis: s.hubMode === 'kuis',\n      hubKuisResult: s.hubMode === 'kuis-done',\n      onStartSampah: () => this.startSampah(),\n
